<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Example child website</title>
  <style>
    body { font: 16px/1.6 system-ui, sans-serif; max-width: 900px; margin: 4rem auto; padding: 0 1rem; }
    [data-ve-id] { transition: outline-color .12s ease; }
    [data-ve-edit-mode] [data-ve-id] { cursor: pointer; outline: 1px dashed transparent; outline-offset: 5px; }
    [data-ve-edit-mode] [data-ve-id]:hover { outline-color: #6478f7; }
    [data-ve-selected] { outline: 2px solid #6478f7 !important; outline-offset: 5px; }
  </style>
</head>
<body>
  <main>
    <h1 data-ve-id="home.hero.title">Build Better Digital Experiences</h1>
    <p data-ve-id="home.hero.description">A sample website embedded in the visual editor.</p>
    <a data-ve-id="home.hero.cta" href="/contact">Contact us</a>
  </main>
  <p><strong>Demo note:</strong> This HTML is a markup example. Bundle/import the SDK from your own TypeScript app using the README instructions.</p>
</body>
</html>
